<title>Bar kvíz</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #1a1a1a;
    --panel2: #242424;
    --line: #333;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --red: #e53935;
    --red-dark: #b71c1c;
    --green: #43a047;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.4;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 2px solid var(--red);
    padding: 10px 12px 8px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: .5px; }
  h1 span { color: var(--red); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tab {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 4px; font-size: 14px; font-weight: 600;
  }
  .tab.active { background: var(--red); border-color: var(--red); }
  .filterRow { display: flex; gap: 6px; margin-top: 8px; }
  select, input[type=search] {
    flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px;
  }
  .small-btn {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 12px; font-size: 13px;
  }
  main { padding: 14px 12px; max-width: 640px; margin: 0 auto; }
  .stats { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 10px; }
  .stats b { color: var(--text); }

  /* Kartičky */
  .card {
    perspective: 1000px; height: 360px; margin-bottom: 14px; cursor: pointer; user-select: none;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .45s; transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: safe center;
    padding: 20px; text-align: center; overflow: auto;
  }
  .face.back { transform: rotateY(180deg); border-color: var(--red); }
  .face .sec { color: var(--red); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .face .name { font-size: 28px; font-weight: 700; }
  .face .note { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .face .ing { font-size: 19px; margin: 8px 0 14px; }
  .face .price { font-size: 30px; font-weight: 800; color: var(--red); }
  .face .hint { position: absolute; bottom: 12px; color: var(--muted); font-size: 13px; }

  .btn {
    display: block; width: 100%; border: none; border-radius: 14px;
    padding: 18px 12px; font-size: 18px; font-weight: 700; color: #fff;
    background: var(--panel2); margin-bottom: 10px;
  }
  .btn:active { transform: scale(.98); }
  .btn.red { background: var(--red); }
  .btn.green { background: var(--green); }
  .btn.outline { background: transparent; border: 2px solid var(--line); color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .btn { margin: 0; }

  /* Kvíz */
  .question {
    background: var(--panel); border-radius: 18px; border: 2px solid var(--line);
    padding: 22px 16px; text-align: center; margin-bottom: 14px; min-height: 140px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .question .sec { color: var(--red); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .question .q { font-size: 24px; font-weight: 700; }
  .question .q.ing { font-size: 20px; font-weight: 600; }
  .question .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .opt {
    display: block; width: 100%; text-align: center; border: 2px solid var(--line);
    background: var(--panel); color: var(--text); border-radius: 14px;
    padding: 18px 12px; font-size: 19px; font-weight: 600; margin-bottom: 10px;
  }
  .opt.correct { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { background: var(--red-dark); border-color: var(--red); color: #fff; }
  .opt:disabled { opacity: 1; }

  /* Prohlížení */
  .section { margin-bottom: 20px; }
  .section h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--red);
    border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0 0 8px;
  }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1f1f1f; }
  .item .l { flex: 1; min-width: 0; }
  .item .n { font-weight: 600; }
  .item .i { color: var(--muted); font-size: 14px; }
  .item .p { font-weight: 700; white-space: nowrap; }
  .item .st { font-size: 12px; color: var(--muted); }
  .item .st .ok { color: var(--green); } .item .st .ko { color: var(--red); }
  .quest { background: var(--panel); border-left: 4px solid var(--red); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .seg button { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; font-size: 14px; font-weight: 600; }
  .seg button.active { color: #fff; border-color: var(--red); }
  .face .short { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .face .long { font-size: 15px; color: #ddd; margin-bottom: 10px; }
  .face .drinks { font-size: 13px; color: var(--muted); }
  .face .drinks b { color: var(--red); }
  .gl { font-size: 13px; color: var(--muted); text-align: left; margin: -4px 0 12px; width: 100%; }
  .gl b { color: #ddd; }
  .intro { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  .step {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px; margin-bottom: 8px; font-size: 16px;
  }
  .step.done { border-color: var(--green); }
  .step .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-weight: 800; }
  .step.done .num { background: var(--green); }
  .step .body { flex: 1; min-width: 0; }
  .step .t { font-weight: 700; }
  .step .d { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar div { height: 100%; background: var(--red); }
  .step.done .bar div { background: var(--green); }
  .step .pct { flex: none; font-weight: 700; font-size: 14px; width: 42px; text-align: right; }
  .link { display: block; width: 100%; background: none; border: none; color: var(--muted); font-size: 14px; padding: 12px; text-decoration: underline; }
  .pen { flex: none; background: none; border: none; font-size: 16px; padding: 0 0 0 4px; opacity: .6; align-self: flex-start; }
  .datainfo { color: var(--muted); font-size: 13px; text-align: center; margin-top: 16px; line-height: 1.6; }
  .datainfo a { color: var(--muted); }
  .timer { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .timer div { height: 100%; width: 100%; background: var(--green); }
  .timer div.low { background: var(--red); }
  .result { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 22px; text-align: center; margin-bottom: 14px; }
  .result.pass { border-color: var(--green); } .result.fail { border-color: var(--red); }
  .result .big { font-size: 48px; font-weight: 800; }
  .result .verdict { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
  .result .sub, .box .sub { color: var(--muted); font-size: 14px; }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; }
  .box { background: var(--panel); border-top: 2px solid var(--red); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; }
  .box h3 { margin: 0 0 10px; }
  .box .cur { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 10px; font-size: 14px; color: #ccc; margin-bottom: 10px; }
  .box textarea, .box input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; margin-bottom: 10px; font-family: inherit; }
  .hidden { display: none !important; }
</style>
</head>

function load(key, def) {

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtPrice = p => p === 0 ? 'ZDARMA' : p + ' Kč';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const uniq = a => [...new Set(a)];

function buildData(d) {
  DATA = d;
  ITEMS = d.menu.filter(r => r[2]).map(([group, sec, name, ing, price, note]) => ({
    key: name, group: group || 'Ostatní', sec: sec || group || 'Ostatní', secName: sec || group || 'Ostatní',
    name, ing: ing || null, price: Number(price) || 0, note: note || '',
  }));
  // druhy/příchutě z poznámky („Malina / Jahoda / …"), počítají se od 3 druhů
  ITEMS.forEach(i => {
    const f = i.note.split('/').map(x => x.trim()).filter(Boolean);
    i.flavors = f.length >= 3 ? f : null;
  });
  FLAV = ITEMS.filter(i => i.flavors);
  SECTIONS = uniq(ITEMS.map(i => i.sec)).map(s => ({ id: s, name: s, group: ITEMS.find(i => i.sec === s).group }));
  GLOS = d.sur.filter(r => r[0]).map(([name, short, long, terms]) => {
    const t = (terms ? String(terms).split(',') : [name]).map(x => norm(x.trim())).filter(Boolean);
    return {
      key: 'g|' + name, name, short: short || '', long: long || '', terms: t,
      drinks: ITEMS.filter(i => i.ing && t.some(x => norm(i.ing).includes(x))).map(i => i.name),
    };
  });
  SIDEQUESTS = d.side.filter(r => r[0]);

  // skupiny: nejdřív ty s recepty (míchané), pak zbytek v pořadí z tabulky
  const groups = uniq(ITEMS.map(i => i.group));
  const hasIng = g => ITEMS.some(i => i.group === g && i.ing);
  GROUPS = [...groups.filter(hasIng), ...groups.filter(g => !hasIng(g) && g !== 'Ostatní'), ...groups.filter(g => !hasIng(g) && g === 'Ostatní')];

  STEPS = [{ t: 'Suroviny', d: 'Nejdřív co je Kahlúa, Cointreau, Campari…', mode: 'glos' }];
  if (FLAV.length) STEPS.push({ t: 'Druhy pyré a limonád', d: 'Příchutě: ' + FLAV.map(i => i.name).join(', '), mode: 'flav' });
  GROUPS.forEach(g => {
    if (hasIng(g)) {
      SECTIONS.filter(s => s.group === g).forEach(s =>
        STEPS.push({ t: s.name, d: 'Kartičky: suroviny a cena', mode: 'cards', filter: 'sec:' + s.id }));
      STEPS.push({ t: 'Ceny – ' + g, d: 'Kvíz na ceny', mode: 'price', filter: 'grp:' + g });
      STEPS.push({ t: 'Poznej drink podle surovin', d: 'Opakování: ' + g, mode: 'ing', filter: 'grp:' + g });
    } else {
      const secs = SECTIONS.filter(s => s.group === g).map(s => s.name.replace(/^.*– |\s*\(.*\)$/g, ''));
      STEPS.push({ t: g, d: 'Kartičky: ' + secs.join(', '), mode: 'cards', filter: 'grp:' + g });
      STEPS.push({ t: 'Ceny – ' + g, d: 'Kvíz na ceny', mode: 'price', filter: 'grp:' + g });
    }
  });
  STEPS.push({ t: '🏁 Závěrečná zkouška', d: '40 otázek ze všeho, na splnění 90 %', mode: 'exam' });

  const sel = $('#filter');
  sel.innerHTML = `<option value="all">Celé menu</option>` +
    GROUPS.map(g => `<option value="grp:${esc(g)}">Všechno: ${esc(g)}</option>`).join('') +
    SECTIONS.map(s => `<option value="sec:${esc(s.id)}">${esc(s.name)}</option>`).join('');
  if (ui && ![...sel.options].some(o => o.value === ui.filter)) ui.filter = 'all';
}

const itemsFor = f => f === 'all' ? ITEMS
  : f.startsWith('grp:') ? ITEMS.filter(i => i.group === f.slice(4))

function stepPool(st) {
  if (st.mode === 'glos') return GLOS;
  if (st.mode === 'flav') return FLAV;
  const p = itemsFor(st.filter);
  return st.mode === 'price' ? p.filter(i => i.price > 0) : st.mode === 'ing' ? p.filter(i => i.ing) : p;
}
const glosFor = item => item.ing ? GLOS.filter(g => g.terms.some(t => norm(item.ing).includes(t))) : [];

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.slice(1).map(r => r.map(c => c.trim()));  // bez hlavičky
}
async function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  const t = await r.text();
  if (t.trim().startsWith('<')) throw new Error('není veřejná');
  return parseCSV(t);
}
const parsePrice = v => { const n = parseInt(String(v).replace(/\s/g, ''), 10); return isNaN(n) ? 0 : n; };

let dataStatus = load(LS_DATA, null) ? 'Z tabulky (uloženo v telefonu)' : 'Vestavěná data';
async function refreshData() {
  try {
    const [menu, sur, side, nast] = await Promise.all(['Menu', 'Suroviny', 'Sidequesty', 'Nastaveni'].map(fetchSheet));
    if (!menu.length) throw new Error('prázdné menu');
    const d = {
      menu: menu.filter(r => r[2]).map(r => [r[0], r[1], r[2], r[3] || '', parsePrice(r[4]), r[5] || '']),
      sur: sur.filter(r => r[0]).map(r => [r[0], r[1] || '', r[2] || '', r[3] || '']),
      side: side.filter(r => r[0]).map(r => [r[0], r[1] || '']),
      email: ((nast.find(r => norm(r[0]).includes('mail')) || [])[1] || '').trim(),
    };
    dataStatus = 'Z tabulky, aktuální (' + new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }) + ')';
    if (JSON.stringify(d) !== JSON.stringify(DATA)) {
      save(LS_DATA, d);
      buildData(d);
      if (['path', 'browse'].includes(ui.mode) || (ui.mode === 'glos' && ui.gmode === 'list')) render();
    } else if (ui.mode === 'path') render();
  } catch (e) {
    dataStatus += ' – tabulku se nepodařilo načíst';
    if (ui.mode === 'path') render();
  }
}

let progress = load(LS_PROGRESS, {});           // { key: { ok, ko } }
// převod starých klíčů "sekce|název" na "název"
Object.keys(progress).forEach(k => {
  const p = k.split('|');
  const nk = p.length === 3 && p[0] === 'price' ? 'price|' + p[2]
    : p.length === 2 && p[0] !== 'price' && p[0] !== 'g' ? p[1] : null;
  if (nk) { progress[nk] = progress[nk] || progress[k]; delete progress[k]; }
});
const ui = Object.assign({ mode: 'path', filter: 'all', gmode: 'cards' }, load(LS_UI, {}));
let lastKey = null;
let session = { ok: 0, ko: 0 };

function stat(item, pre = '') { return progress[pre + item.key] || { ok: 0, ko: 0 }; }
function record(item, correct, pre = '', count = true) {
  const s = Object.assign({ ok: 0, ko: 0 }, progress[pre + item.key]);
  correct ? s.ok++ : s.ko++;
  progress[pre + item.key] = s;
  save(LS_PROGRESS, progress);
  if (count) correct ? session.ok++ : session.ko++;
}
// „Umím" = aspoň 2× správně a víc správně než špatně
const isKnown = (item, pre = '') => { const s = stat(item, pre); return s.ok >= 2 && s.ok > s.ko; };

// Váha: neznámé a často špatně zodpovězené položky chodí častěji
function weight(item, pre) {
  const s = stat(item, pre);
  const boost = item.flavors ? 2 : 1;  // položky s příchutěmi (pyré, limonády) chodí 2× častěji
  if (s.ok + s.ko === 0) return 3 * boost;
  return Math.max(0.25, 1 + s.ko * 2 - s.ok * 0.7) * boost;
}
function pickWeighted(pool, pre = '') {
  if (pool.length > 1) pool = pool.filter(i => i.key !== lastKey);
  const total = pool.reduce((a, i) => a + weight(i, pre), 0);
  let r = Math.random() * total;
  for (const i of pool) { r -= weight(i, pre); if (r <= 0) { lastKey = i.key; return i; } }
  lastKey = pool[pool.length - 1].key;
  return pool[pool.length - 1];
}

function statsLine(pool, pre = '') {
  const known = pool.filter(i => isKnown(i, pre)).length;
  return `<div class="stats">Umím <b>${known}</b> / ${pool.length} · Tohle kolo: <b style="color:var(--green)">${session.ok}</b> ✓ <b style="color:var(--red)">${session.ko}</b> ✗</div>`;
}

// ===================== OTÁZKY =====================
// Každá otázka: { item, pre, html, options, correct, explain, text }
function qPrice(it) {
  const set = new Set([it.price]);
  shuffle(ITEMS.filter(i => i.sec === it.sec && i.price > 0).map(i => i.price))
    .forEach(p => { if (set.size < 4) set.add(p); });
  for (const d of shuffle([-30, -20, -15, -10, -5, 5, 10, 15, 20, 30])) {
    if (set.size >= 4) break;
    if (it.price + d > 0) set.add(it.price + d);
  }
  return {
    item: it, pre: PREFIX.price, text: 'Cena: ' + it.name,
    html: `<div class="sec">${esc(it.secName)}</div><div class="q">${esc(it.name)}</div>` +
      (it.note ? `<div class="sub">${esc(it.note)}</div>` : '') + `<div class="sub">Kolik to stojí?</div>`,
    options: shuffle([...set]).map(fmtPrice), correct: fmtPrice(it.price), explain: '',
  };
}
function qIng(it) {
  const all = ITEMS.filter(i => i.ing && i.name !== it.name && i.ing !== it.ing);
  const names = new Set([it.name]);
  [...shuffle(all.filter(i => i.sec === it.sec)), ...shuffle(all.filter(i => i.sec !== it.sec))]
    .forEach(i => { if (names.size < 4) names.add(i.name); });
  return {
    item: it, pre: '', text: 'Drink: ' + it.ing,
    html: `<div class="sec">Který drink to je?</div><div class="q ing">${esc(it.ing)}</div>`,
    options: shuffle([...names]), correct: it.name,
    explain: glosFor(it).map(g => `<div><b>${esc(g.name)}</b> = ${esc(g.short)}</div>`).join(''),
  };
}
const EXTRA_FLAVORS = ['Borůvka', 'Broskev', 'Ananas', 'Kokos', 'Višeň', 'Meloun', 'Citron', 'Pomeranč', 'Liči', 'Máta', 'Jahoda', 'Malina', 'Mango'];
function qFlav(it) {
  const mine = new Set(it.flavors.map(norm));
  const others = shuffle(uniq([...FLAV.filter(i => i !== it).flatMap(i => i.flavors), ...EXTRA_FLAVORS]))
    .filter(f => !mine.has(norm(f)) && !it.flavors.some(m => norm(m).includes(norm(f))));
  const list = `<div>${esc(it.name)}: <b>${esc(it.flavors.join(', '))}</b></div>`;
  if (Math.random() < 0.5) {
    const wrong = others[0];
    return {
      item: it, pre: PREFIX.flav, text: 'Co NENÍ u: ' + it.name,
      html: `<div class="sec">${esc(it.secName)}</div><div class="q">${esc(it.name)}</div><div class="sub">Která příchuť tu <b>NENÍ</b>?</div>`,
      options: shuffle([wrong, ...shuffle(it.flavors).slice(0, 3)]), correct: wrong, explain: list,
    };
  }
  const right = shuffle(it.flavors)[0];
  return {
    item: it, pre: PREFIX.flav, text: 'Příchuť u: ' + it.name,
    html: `<div class="sec">${esc(it.secName)}</div><div class="q">${esc(it.name)}</div><div class="sub">Která příchuť tu <b>JE</b>?</div>`,
    options: shuffle([right, ...others.slice(0, 3)]), correct: right, explain: list,
  };
}
function qGlos(g) {
  // v otázce skryjeme název suroviny, aby nebyl vidět
  let q = g.long;
  g.name.split(/[\s()]+/).filter(w => w.length > 3).forEach(w => {
    q = q.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return {
    item: g, pre: '', text: 'Surovina: ' + g.short,
    html: `<div class="sec">Co je to za surovinu?</div><div class="q ing">${esc(g.short)}</div><div class="sub">${esc(q)}</div>`,
    options: shuffle([g.name, ...shuffle(GLOS.filter(x => x !== g)).slice(0, 3).map(x => x.name)]),
    correct: g.name,
    explain: g.drinks.length ? `<div>V drincích: <b>${esc(g.drinks.join(', '))}</b></div>` : '',
  };
}

// Kvíz s okamžitou zpětnou vazbou
function renderQuiz(q, top, onNext) {
  $('#main').innerHTML = top +
    `<div class="question">${q.html}</div>` +
    q.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('') +
    `<div class="gl hidden" id="explain" style="text-align:center;margin:4px 0 12px">${q.explain}</div>` +
    `<button class="btn red hidden" id="next">Další →</button>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.v === q.correct;
    document.querySelectorAll('.opt').forEach(x => {
      x.disabled = true;
      if (x.dataset.v === q.correct) x.classList.add('correct');
    });
    if (!ok) b.classList.add('wrong');
    record(q.item, ok, q.pre);
    if (ok) setTimeout(() => onNext(ok), 700);
    else {
      if (q.explain) $('#explain').classList.remove('hidden');
      $('#next').classList.remove('hidden'); $('#next').onclick = () => onNext(ok);
    }
  });
}

// ===================== REŽIMY =====================
let examTimer = null;
function render() {
  clearInterval(examTimer);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === ui.mode));
  $('#filterRow').classList.toggle('hidden', ['path', 'glos', 'exam', 'flav'].includes(ui.mode));
  $('#searchRow').classList.toggle('hidden', ui.mode !== 'browse');
  $('#filter').value = ui.filter;
  save(LS_UI, { mode: ui.mode === 'exam' ? 'path' : ui.mode, filter: ui.filter, gmode: ui.gmode });
  ({ path: renderPath, glos: renderGlos, cards: renderCards, price: renderPrice, ing: renderIng, browse: renderBrowse, exam: renderExam, flav: renderFlav })[ui.mode]();
  window.scrollTo(0, 0);
}

function go(mode, filter) {
  ui.mode = mode;
  if (filter) ui.filter = filter;
  session = { ok: 0, ko: 0 };
  exam = null;
  render();
}

// ---- 0. Postup učení ----
function renderPath() {
  const ex = load(LS_EXAM, {});
  const pct = st => {
    if (st.mode === 'exam') return ex.best || 0;
    const p = stepPool(st);
    return p.length ? Math.round(100 * p.filter(i => isKnown(i, PREFIX[st.mode])).length / p.length) : 100;
  };
  const goal = st => st.mode === 'exam' ? 90 : 80;
  const pcts = STEPS.map(pct);
  const nextIdx = STEPS.findIndex((st, i) => pcts[i] < goal(st));
  $('#main').innerHTML =
    `<p class="intro">Jdi odshora dolů. Krok je hotový na 80 %. Položka se počítá jako naučená, když ji víš aspoň 2× a častěji správně než špatně.</p>` +
    (nextIdx >= 0
      ? `<button class="btn red" id="cont">▶ Pokračovat: ${esc(STEPS[nextIdx].t)}</button>`
      : `<div class="stats" style="font-size:18px">🏆 Umíš celé menu a máš splněnou zkoušku!</div>`) +
    STEPS.map((st, i) => `
      <button class="step ${pcts[i] >= goal(st) ? 'done' : ''}" data-i="${i}">
        <div class="num">${pcts[i] >= goal(st) ? '✓' : i + 1}</div>
        <div class="body"><div class="t">${esc(st.t)}</div><div class="d">${esc(st.d)}${st.mode === 'exam' && ex.best != null ? ` · nejlepší ${ex.best} %` : ''}</div>
          <div class="bar"><div style="width:${pcts[i]}%"></div></div></div>
        <div class="pct">${pcts[i]} %</div>
      </button>`).join('') +
    `<div class="datainfo">Obsah: ${esc(dataStatus)}<br><a href="${SHEET_URL}" target="_blank" rel="noopener">Upravit obsah v Google Tabulce</a> (jen pro ty, kdo k ní mají přístup)</div>`;
  const start = st => { if (st.mode === 'glos') ui.gmode = 'cards'; go(st.mode, st.filter || 'all'); };
  if (nextIdx >= 0) $('#cont').onclick = () => start(STEPS[nextIdx]);
  document.querySelectorAll('.step').forEach(b => b.onclick = () => start(STEPS[+b.dataset.i]));
}

// ---- Suroviny ----
function renderGlos() {
  const seg = `<div class="seg">` + [['cards', 'Kartičky'], ['quiz', 'Kvíz'], ['list', 'Seznam']]
    .map(([m, l]) => `<button data-g="${m}" class="${ui.gmode === m ? 'active' : ''}">${l}</button>`).join('') + `</div>`;
  const bindSeg = () => document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { ui.gmode = b.dataset.g; session = { ok: 0, ko: 0 }; render(); });
  if (!GLOS.length) { empty('Žádné suroviny.'); return; }

  if (ui.gmode === 'list') {
    $('#main').innerHTML = seg + `<div class="glist">` + GLOS.map((g, idx) => {
      const s = stat(g);
      return `<div class="item"><div class="l">
        <div class="n">${esc(g.name)}</div>
        <div class="i"><b style="color:#ddd">${esc(g.short)}.</b> ${esc(g.long)}</div>
        ${g.drinks.length ? `<div class="i">🍸 ${esc(g.drinks.join(', '))}</div>` : ''}
        ${s.ok + s.ko ? `<div class="st"><span class="ok">✓ ${s.ok}</span> · <span class="ko">✗ ${s.ko}</span></div>` : ''}
      </div><button class="pen" data-g="${idx}" aria-label="Navrhnout opravu">✏️</button></div>`;
    }).join('') + `</div>`;
    document.querySelectorAll('.pen').forEach(b => b.onclick = () => suggest(GLOS[+b.dataset.g]));
    return bindSeg();
  }

  if (ui.gmode === 'cards') {
    const g = pickWeighted(GLOS);
    $('#main').innerHTML = seg + statsLine(GLOS) + `
      <div class="card" id="card"><div class="card-inner">
        <div class="face front">
          <div class="sec">Surovina</div>
          <div class="name">${esc(g.name)}</div>
          <div class="hint">Co to je? Klepni pro otočení</div>
        </div>
        <div class="face back">
          <div class="sec">${esc(g.name)}</div>
          <div class="short">${esc(g.short)}</div>
          <div class="long">${esc(g.long)}</div>
          ${g.drinks.length ? `<div class="drinks">V drincích: <b>${esc(g.drinks.join(', '))}</b></div>` : ''}
        </div>
      </div></div>` + answerButtons();
    bindCard(g);
  } else {
    const q = qGlos(pickWeighted(GLOS));
    renderQuiz(q, seg + statsLine(GLOS), render);
  }
  bindSeg();
}

function answerButtons() {
  return `<div id="answer" class="hidden">
      <div class="two">
        <button class="btn red" id="no">Nevěděl jsem</button>
        <button class="btn green" id="yes">Věděl jsem</button>
      </div>
      <button class="link" id="sug">✏️ Je tu chyba? Navrhnout opravu</button>
    </div>
    <button class="btn outline" id="flip">Otočit</button>`;
}
function bindCard(it) {
  const flip = () => {
    $('#card').classList.toggle('flipped');
    $('#answer').classList.remove('hidden');
    $('#flip').classList.add('hidden');
  };
  $('#card').onclick = flip;
  $('#flip').onclick = flip;
  $('#yes').onclick = () => { record(it, true); render(); };
  $('#no').onclick = () => { record(it, false); render(); };
  $('#sug').onclick = () => suggest(it);
}

// ---- 1. Kartičky ----
function renderCards() {
  const pool = itemsFor(ui.filter);
  if (!pool.length) return empty();
  const it = pickWeighted(pool);
  const gl = glosFor(it);
  $('#main').innerHTML = statsLine(pool) + `
    <div class="card" id="card">
      <div class="card-inner">
        <div class="face front">
          <div class="sec">${esc(it.secName)}</div>
          <div class="name">${esc(it.name)}</div>
          ${it.note && !it.flavors ? `<div class="note">${esc(it.note)}</div>` : ''}
          ${it.flavors ? `<div class="note">Jaké má příchutě?</div>` : ''}
          <div class="hint">Klepni pro otočení</div>
        </div>
        <div class="face back">
          <div class="sec">${esc(it.name)}</div>
          ${it.ing ? `<div class="ing">${esc(it.ing)}</div>` : ''}
          ${it.flavors ? `<div class="ing">Příchutě: <b>${esc(it.flavors.join(', '))}</b></div>` : ''}
          ${gl.length ? `<div class="gl">${gl.map(g => `<div><b>${esc(g.name)}</b> = ${esc(g.short)}</div>`).join('')}</div>` : ''}
          <div class="price">${fmtPrice(it.price)}</div>
        </div>
      </div>
    </div>` + answerButtons();
  bindCard(it);
}

// ---- Druhy pyré a limonád ----
function renderFlav() {
  if (!FLAV.length) return empty('V menu nejsou položky s příchutěmi.');
  renderQuiz(qFlav(pickWeighted(FLAV, PREFIX.flav)),
    `<div class="stats" style="margin-bottom:4px">Druhy pyré a limonád</div>` + statsLine(FLAV, PREFIX.flav), render);
}

// ---- 2. Kvíz ceny ----
function renderPrice() {
  const pool = itemsFor(ui.filter).filter(i => i.price > 0);
  if (!pool.length) return empty('V této sekci nejsou položky s cenou.');
  renderQuiz(qPrice(pickWeighted(pool, PREFIX.price)), statsLine(pool, PREFIX.price), render);
}

// ---- 3. Kvíz: poznej drink podle surovin ----
function renderIng() {
  const pool = itemsFor(ui.filter).filter(i => i.ing);
  if (!pool.length) return empty('V této sekci nejsou drinky se surovinami. Vyber jinou sekci.');
  renderQuiz(qIng(pickWeighted(pool)), statsLine(pool), render);
}

// ---- 4. Prohlížení ----
function renderBrowse() {
  const q = norm($('#search').value.trim());
  const match = i => !q || norm(i.name + ' ' + (i.ing || '') + ' ' + i.note + ' ' + i.price).includes(q);
  const pool = itemsFor(ui.filter);
  let html = '';
  SECTIONS.forEach(sec => {
    const items = pool.filter(i => i.sec === sec.id && match(i));
    if (!items.length) return;
    html += `<div class="section"><h2>${esc(sec.name)}</h2>` + items.map(i => {
      const s = stat(i);
      return `<div class="item"><div class="l">
        <div class="n">${esc(i.name)}</div>
        ${i.note ? `<div class="i">${esc(i.note)}</div>` : ''}
        ${i.ing ? `<div class="i">${esc(i.ing)}</div>` : ''}
        ${s.ok + s.ko ? `<div class="st"><span class="ok">✓ ${s.ok}</span> · <span class="ko">✗ ${s.ko}</span></div>` : ''}
      </div><div class="p">${fmtPrice(i.price)}</div><button class="pen" data-k="${esc(i.key)}" aria-label="Navrhnout opravu">✏️</button></div>`;
    }).join('') + `</div>`;
  });
  if (ui.filter === 'all') {
    const qs = SIDEQUESTS.filter(([n, d]) => !q || norm(n + ' ' + d).includes(q));
    if (qs.length) html += `<div class="section"><h2>⚔️ Sidequesty</h2>` +
      qs.map(([n, d]) => `<div class="quest"><div class="n"><b>${esc(n)}</b></div><div class="i" style="color:var(--muted)">${esc(d)}</div></div>`).join('') + `</div>`;
  }
  $('#main').innerHTML = html || `<div class="empty">Nic nenalezeno.</div>`;
  document.querySelectorAll('.pen').forEach(b => b.onclick = () => suggest(ITEMS.find(i => i.key === b.dataset.k)));
}

// ---- 5. Závěrečná zkouška ----
const EXAM_LEN = 40, EXAM_SECONDS = 20, EXAM_PASS = 90;
let exam = null;

function newExam() {
  // 10 surovin, 4 příchutě, zbytek napůl ceny a poznávání drinků
  const nG = Math.min(GLOS.length, 10);
  const nF = FLAV.length ? 4 : 0, flav = shuffle(FLAV);
  const withIng = ITEMS.filter(i => i.ing), priced = ITEMS.filter(i => i.price > 0);
  const nI = Math.min(withIng.length, Math.round((EXAM_LEN - nG - nF) / 2));
  const nP = Math.min(priced.length, EXAM_LEN - nG - nF - nI);
  const qs = [
    ...shuffle(GLOS).slice(0, nG).map(qGlos),
    ...shuffle(withIng).slice(0, nI).map(qIng),
    ...shuffle(priced).slice(0, nP).map(qPrice),
    ...Array.from({ length: nF }, (_, k) => qFlav(flav[k % flav.length])),
  ];
  return { qs: shuffle(qs), i: 0, answers: [], done: false, practice: null };
}

function renderExam() {
  if (!exam) {
    const ex = load(LS_EXAM, {});
    $('#main').innerHTML = `
      <div class="question" style="text-align:left">
        <div class="sec" style="text-align:center">Závěrečná zkouška</div>
        <div>• ${EXAM_LEN} otázek ze všeho: suroviny, příchutě, ceny, poznávání drinků</div>
        <div>• Na každou otázku máš ${EXAM_SECONDS} sekund</div>
        <div>• Správné odpovědi uvidíš až na konci</div>
        <div>• Na splnění potřebuješ ${EXAM_PASS} %</div>
        ${ex.best != null ? `<div class="sub" style="margin-top:10px">Nejlepší výsledek: <b>${ex.best} %</b> · poslední: ${ex.last} %</div>` : ''}
      </div>
      <button class="btn red" id="start">Začít zkoušku</button>`;
    $('#start').onclick = () => { exam = newExam(); renderExam(); };
    return;
  }
  if (exam.practice) return renderPractice();
  if (exam.done) return renderExamResult();

  const q = exam.qs[exam.i];
  $('#main').innerHTML = `
    <div class="stats">Otázka <b>${exam.i + 1}</b> / ${exam.qs.length}</div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="question">${q.html}</div>` +
    q.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('') +
    `<button class="link" id="quit">Ukončit zkoušku</button>`;
  const answer = v => {
    clearInterval(examTimer);
    const ok = v === q.correct;
    exam.answers.push({ q, given: v, ok });
    record(q.item, ok, q.pre, false);
    exam.i++;
    if (exam.i >= exam.qs.length) finishExam();
    renderExam();
  };
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.v));
  $('#quit').onclick = () => { if (confirm('Ukončit zkoušku? Výsledek se nezapočítá.')) { exam = null; renderExam(); } };
  const t0 = Date.now();
  examTimer = setInterval(() => {
    const left = 1 - (Date.now() - t0) / (EXAM_SECONDS * 1000);
    const bar = $('#tbar');
    if (!bar) return clearInterval(examTimer);
    bar.style.width = Math.max(0, left * 100) + '%';
    bar.classList.toggle('low', left < 0.25);
    if (left <= 0) answer(null);
  }, 100);
  window.scrollTo(0, 0);
}

function finishExam() {
  exam.done = true;
  const ok = exam.answers.filter(a => a.ok).length;
  exam.pct = Math.round(100 * ok / exam.answers.length);
  const ex = load(LS_EXAM, {});
  save(LS_EXAM, { best: Math.max(ex.best || 0, exam.pct), last: exam.pct, date: new Date().toISOString() });
}

function renderExamResult() {
  const wrong = exam.answers.filter(a => !a.ok);
  const passed = exam.pct >= EXAM_PASS;
  $('#main').innerHTML = `
    <div class="result ${passed ? 'pass' : 'fail'}">
      <div class="big">${exam.pct} %</div>
      <div>${exam.answers.length - wrong.length} / ${exam.answers.length} správně</div>
      <div class="verdict">${passed ? '✅ SPLNĚNO' : '❌ NESPLNĚNO'}</div>
      <div class="sub">${passed ? 'Menu umíš. Dobrá práce!' : `Na splnění je potřeba ${EXAM_PASS} %.`}</div>
    </div>
    ${wrong.length ? `<button class="btn red" id="practice">Procvičit chyby (${wrong.length})</button>` : ''}
    <button class="btn" id="again">Nová zkouška</button>
    ${wrong.length ? `<div class="section"><h2>Chyby</h2>` + wrong.map(a => `
      <div class="item"><div class="l">
        <div class="i">${esc(a.q.text)}</div>
        <div class="n" style="color:var(--green)">✓ ${esc(a.q.correct)}</div>
        <div class="i" style="color:var(--red)">✗ ${a.given == null ? 'nestihl jsi' : esc(a.given)}</div>
      </div></div>`).join('') + `</div>` : ''}`;
  if (wrong.length) $('#practice').onclick = () => { exam.practice = wrong.map(a => a.q); session = { ok: 0, ko: 0 }; renderExam(); };
  $('#again').onclick = () => { exam = newExam(); renderExam(); };
}

// Procvičení chyb: dokola, dokud každou neodpovíš správně
function renderPractice() {
  if (!exam.practice.length) {
    $('#main').innerHTML = `<div class="result pass"><div class="big">✓</div><div>Všechny chyby opravené!</div></div>
      <button class="btn red" id="again">Nová zkouška</button><button class="btn" id="back">Zpět na výsledek</button>`;
    $('#again').onclick = () => { exam = newExam(); renderExam(); };
    $('#back').onclick = () => { exam.practice = null; renderExam(); };
    return;
  }
  const q = exam.practice[0];
  q.options = shuffle(q.options);
  renderQuiz(q, `<div class="stats">Zbývá opravit: <b>${exam.practice.length}</b></div>`, ok => {
    exam.practice.shift();
    if (!ok) exam.practice.push(q);
    renderExam();
    window.scrollTo(0, 0);
  });
}

// ===================== NÁVRH OPRAVY =====================
function suggest(it) {
  const isGlos = it.key.startsWith('g|');
  const current = isGlos
    ? `Surovina: ${it.name}\nKrátce: ${it.short}\nPopis: ${it.long}`
    : `Položka: ${it.name}\nSekce: ${it.secName}\nSuroviny: ${it.ing || '-'}\nCena: ${fmtPrice(it.price)}` + (it.note ? `\nPoznámka: ${it.note}` : '');
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box">
      <h3>Návrh opravy</h3>
      <div class="cur">${esc(current)}</div>
      <textarea id="sugText" rows="4" placeholder="Co je špatně a jak to má být správně?"></textarea>
      <input id="sugName" placeholder="Tvoje jméno (nepovinné)" value="${esc(load(LS_NAME, ''))}">
      <button class="btn red" id="sugSend">Odeslat e-mailem</button>
      <button class="btn" id="sugCopy">Zkopírovat text</button>
      <button class="link" id="sugClose">Zavřít</button>
      ${DATA.email ? '' : '<div class="sub">E-mail šéfa zatím není v tabulce nastavený (list Nastaveni), adresu vyplníš v e-mailu sám.</div>'}
    </div>`;
  document.body.appendChild(m);
  const text = () => {
    save(LS_NAME, $('#sugName').value.trim());
    return `Návrh opravy v Bar kvízu\n\nTEĎ JE:\n${current}\n\nMÁ BÝT:\n${$('#sugText').value.trim()}\n\nOd: ${$('#sugName').value.trim() || '(neuvedeno)'}`;
  };
  const close = () => m.remove();
  $('#sugClose').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  $('#sugSend').onclick = () => {
    if (!$('#sugText').value.trim()) return $('#sugText').focus();
    location.href = `mailto:${DATA.email}?subject=${encodeURIComponent('Bar kvíz – oprava: ' + it.name)}&body=${encodeURIComponent(text())}`;
    close();
  };
  $('#sugCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(text()); $('#sugCopy').textContent = '✓ Zkopírováno'; }
    catch (e) { $('#sugCopy').textContent = 'Nepodařilo se zkopírovat'; }
  };
  setTimeout(() => $('#sugText').focus(), 50);
}

function empty(msg) {
  $('#main').innerHTML = `<div class="empty">${esc(msg || 'Žádné položky.')}</div>`;
}

// ===================== INIT =====================
buildData(load(LS_DATA, null) || DEFAULT_DATA);
if (![...$('#filter').options].some(o => o.value === ui.filter)) ui.filter = 'all';
if (!['path', 'glos', 'cards', 'price', 'ing', 'browse', 'flav'].includes(ui.mode)) ui.mode = 'path';
$('#filter').onchange = () => { ui.filter = $('#filter').value; session = { ok: 0, ko: 0 }; render(); };

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  if (exam && !exam.done && ui.mode === 'exam' && !confirm('Ukončit zkoušku? Výsledek se nezapočítá.')) return;
  go(t.dataset.mode);
});
$('#search').oninput = () => renderBrowse();
$('#reset').onclick = () => {
  if (!confirm('Opravdu smazat celý postup?')) return;
  progress = {}; session = { ok: 0, ko: 0 };
  save(LS_PROGRESS, progress);
  save(LS_EXAM, {});
  render();
};

render();
refreshData();
</script>
