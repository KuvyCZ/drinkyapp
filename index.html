<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bar kvíz">
<title>Bar kvíz</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #1a1a1a;
    --panel2: #242424;
    --line: #333;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --red: #e53935;
    --red-dark: #b71c1c;
    --green: #43a047;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.4;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 2px solid var(--red);
    padding: 10px 12px 8px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: .5px; }
  h1 span { color: var(--red); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tab {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 4px; font-size: 14px; font-weight: 600;
  }
  .tab.active { background: var(--red); border-color: var(--red); }
  .filterRow { display: flex; gap: 6px; margin-top: 8px; }
  select, input[type=search] {
    flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px;
  }
  .small-btn {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 12px; font-size: 13px;
  }
  main { padding: 14px 12px; max-width: 640px; margin: 0 auto; }
  .stats { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 10px; }
  .stats b { color: var(--text); }

  /* Kartičky */
  .card {
    perspective: 1000px; height: 300px; margin-bottom: 14px; cursor: pointer; user-select: none;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .45s; transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; overflow: auto;
  }
  .face.back { transform: rotateY(180deg); border-color: var(--red); }
  .face .sec { color: var(--red); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .face .name { font-size: 28px; font-weight: 700; }
  .face .note { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .face .ing { font-size: 19px; margin: 8px 0 14px; }
  .face .price { font-size: 30px; font-weight: 800; color: var(--red); }
  .face .hint { position: absolute; bottom: 12px; color: var(--muted); font-size: 13px; }

  .btn {
    display: block; width: 100%; border: none; border-radius: 14px;
    padding: 18px 12px; font-size: 18px; font-weight: 700; color: #fff;
    background: var(--panel2); margin-bottom: 10px;
  }
  .btn:active { transform: scale(.98); }
  .btn.red { background: var(--red); }
  .btn.green { background: var(--green); }
  .btn.outline { background: transparent; border: 2px solid var(--line); color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .btn { margin: 0; }

  /* Kvíz */
  .question {
    background: var(--panel); border-radius: 18px; border: 2px solid var(--line);
    padding: 22px 16px; text-align: center; margin-bottom: 14px; min-height: 140px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .question .sec { color: var(--red); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .question .q { font-size: 24px; font-weight: 700; }
  .question .q.ing { font-size: 20px; font-weight: 600; }
  .question .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .opt {
    display: block; width: 100%; text-align: center; border: 2px solid var(--line);
    background: var(--panel); color: var(--text); border-radius: 14px;
    padding: 18px 12px; font-size: 19px; font-weight: 600; margin-bottom: 10px;
  }
  .opt.correct { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { background: var(--red-dark); border-color: var(--red); color: #fff; }
  .opt:disabled { opacity: 1; }

  /* Prohlížení */
  .section { margin-bottom: 20px; }
  .section h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--red);
    border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0 0 8px;
  }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1f1f1f; }
  .item .l { flex: 1; min-width: 0; }
  .item .n { font-weight: 600; }
  .item .i { color: var(--muted); font-size: 14px; }
  .item .p { font-weight: 700; white-space: nowrap; }
  .item .st { font-size: 12px; color: var(--muted); }
  .item .st .ok { color: var(--green); } .item .st .ko { color: var(--red); }
  .quest { background: var(--panel); border-left: 4px solid var(--red); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <h1>🍸 Bar <span>kvíz</span></h1>

    <button class="tab" data-mode="cards">Kartičky</button>

    <button class="tab" data-mode="ing">Suroviny</button>
    <button class="tab" data-mode="browse">Menu</button>
  </div>
  <div class="filterRow">
    <select id="filter"></select>
    <button class="small-btn" id="reset">Reset<br>postupu</button>
  </div>
  <div class="filterRow" id="searchRow">
    <input type="search" id="search" placeholder="Hledat drink, surovinu…" autocomplete="off">

</header>

<main id="main"></main>

  ['Prokletí Černé perly', "2× Dark 'n' Stormy + 2× Long Island, jedna osoba do úsvitu"],
  ['Hiroshima', '5× shooter B55'],
];

// Rozbalení do plochého seznamu
const ITEMS = [];
MENU.forEach(sec => sec.items.forEach(([n, ing, p, note]) => {
  ITEMS.push({ key: sec.id + '|' + n, sec: sec.id, secName: sec.name, name: n, ing, price: p, note });
}));

// ===================== STAV =====================
const LS_PROGRESS = 'barquiz_progress_v1';
const LS_UI = 'barquiz_ui_v1';

function load(key, def) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let progress = load(LS_PROGRESS, {});           // { key: { ok, ko } }
const ui = Object.assign({ mode: 'cards', filter: 'all' }, load(LS_UI, {}));
let lastKey = null;
let session = { ok: 0, ko: 0 };

function stat(item) { return progress[item.key] || { ok: 0, ko: 0 }; }
function record(item, correct) {
  const s = Object.assign({ ok: 0, ko: 0 }, progress[item.key]);
  correct ? s.ok++ : s.ko++;
  progress[item.key] = s;
  save(LS_PROGRESS, progress);
  correct ? session.ok++ : session.ko++;
}

// ===================== POMOCNÉ =====================
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtPrice = p => p === 0 ? 'ZDARMA' : p + ' Kč';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function filtered() {
  return ui.filter === 'all' ? ITEMS
    : ui.filter === 'mixed' ? ITEMS.filter(i => i.ing)
    : ITEMS.filter(i => i.sec === ui.filter);
}

// Váha: neznámé a často špatně zodpovězené položky chodí častěji
function weight(item) {
  const s = stat(item);
  if (s.ok + s.ko === 0) return 3;
  return Math.max(0.25, 1 + s.ko * 2 - s.ok * 0.7);
}
function pickWeighted(pool) {
  if (pool.length > 1) pool = pool.filter(i => i.key !== lastKey);
  const total = pool.reduce((a, i) => a + weight(i), 0);
  let r = Math.random() * total;
  for (const i of pool) { r -= weight(i); if (r <= 0) { lastKey = i.key; return i; } }
  lastKey = pool[pool.length - 1].key;
  return pool[pool.length - 1];
}

function statsLine(pool) {
  const known = pool.filter(i => { const s = stat(i); return s.ok > 0 && s.ok > s.ko; }).length;
  return `<div class="stats">Umím <b>${known}</b> / ${pool.length} · Tohle kolo: <b style="color:var(--green)">${session.ok}</b> ✓ <b style="color:var(--red)">${session.ko}</b> ✗</div>`;
}

// ===================== REŽIMY =====================
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === ui.mode));
  $('#searchRow').classList.toggle('hidden', ui.mode !== 'browse');
  save(LS_UI, { mode: ui.mode, filter: ui.filter });
  ({ cards: renderCards, price: renderPrice, ing: renderIng, browse: renderBrowse })[ui.mode]();
  window.scrollTo(0, 0);
}

// ---- 1. Kartičky ----
function renderCards() {
  const pool = filtered();
  if (!pool.length) return empty();
  const it = pickWeighted(pool);
  $('#main').innerHTML = statsLine(pool) + `
    <div class="card" id="card">
      <div class="card-inner">
        <div class="face front">
          <div class="sec">${esc(it.secName)}</div>
          <div class="name">${esc(it.name)}</div>
          ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
          <div class="hint">Klepni pro otočení</div>
        </div>
        <div class="face back">
          <div class="sec">${esc(it.name)}</div>
          ${it.ing ? `<div class="ing">${esc(it.ing)}</div>` : ''}
          <div class="price">${fmtPrice(it.price)}</div>
        </div>
      </div>
    </div>
    <div id="answer" class="two hidden">
      <button class="btn red" id="no">Nevěděl jsem</button>
      <button class="btn green" id="yes">Věděl jsem</button>
    </div>
    <button class="btn outline" id="flip">Otočit</button>`;
  const flip = () => {
    $('#card').classList.toggle('flipped');
    $('#answer').classList.remove('hidden');
    $('#flip').classList.add('hidden');
  };
  $('#card').onclick = flip;
  $('#flip').onclick = flip;
  $('#yes').onclick = () => { record(it, true); renderCards(); };
  $('#no').onclick = () => { record(it, false); renderCards(); };
}

// ---- společné pro kvízy ----
function renderQuiz(it, questionHtml, options, correctLabel) {
  const pool = filtered();
  $('#main').innerHTML = statsLine(ui.mode === 'ing' ? pool.filter(i => i.ing) : pool.filter(i => i.price > 0)) +
    `<div class="question">${questionHtml}</div>` +
    options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('') +
    `<button class="btn red hidden" id="next">Další →</button>`;
  const next = () => render();
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.v === correctLabel;
    document.querySelectorAll('.opt').forEach(x => {
      x.disabled = true;
      if (x.dataset.v === correctLabel) x.classList.add('correct');
    });
    if (!ok) b.classList.add('wrong');
    record(it, ok);
    if (ok) setTimeout(next, 700);
    else { $('#next').classList.remove('hidden'); $('#next').onclick = next; }
  });
}

// ---- 2. Kvíz ceny ----
function renderPrice() {
  const pool = filtered().filter(i => i.price > 0);
  if (!pool.length) return empty('V této sekci nejsou položky s cenou.');
  const it = pickWeighted(pool);
  // distraktory: nejdřív reálné ceny ze stejné sekce, pak blízké ceny
  const set = new Set([it.price]);
  shuffle(ITEMS.filter(i => i.sec === it.sec && i.price > 0).map(i => i.price))
    .forEach(p => { if (set.size < 4) set.add(p); });
  const steps = shuffle([-30, -20, -15, -10, -5, 5, 10, 15, 20, 30]);
  for (const d of steps) { if (set.size >= 4) break; const p = it.price + d; if (p > 0) set.add(p); }
  const opts = shuffle([...set]).map(fmtPrice);
  renderQuiz(it,
    `<div class="sec">${esc(it.secName)}</div><div class="q">${esc(it.name)}</div>` +
    (it.note ? `<div class="sub">${esc(it.note)}</div>` : '') + `<div class="sub">Kolik to stojí?</div>`,
    opts, fmtPrice(it.price));
}

// ---- 3. Kvíz suroviny ----
function renderIng() {
  const pool = filtered().filter(i => i.ing);
  if (!pool.length) return empty('V této sekci nejsou drinky se surovinami. Vyber jinou sekci.');
  const it = pickWeighted(pool);
  const all = ITEMS.filter(i => i.ing && i.name !== it.name && i.ing !== it.ing);
  const same = shuffle(all.filter(i => i.sec === it.sec));
  const other = shuffle(all.filter(i => i.sec !== it.sec));
  const names = new Set([it.name]);
  [...same, ...other].forEach(i => { if (names.size < 4) names.add(i.name); });
  renderQuiz(it,
    `<div class="sec">Který drink to je?</div><div class="q ing">${esc(it.ing)}</div>`,
    shuffle([...names]), it.name);
}

// ---- 4. Prohlížení ----
function renderBrowse() {
  const q = norm($('#search').value.trim());
  const match = i => !q || norm(i.name + ' ' + (i.ing || '') + ' ' + (i.note || '') + ' ' + i.price).includes(q);
  let html = '';
  MENU.forEach(sec => {
    if (ui.filter === 'mixed' && !sec.items.some(i => i[1])) return;
    if (ui.filter !== 'all' && ui.filter !== 'mixed' && ui.filter !== sec.id) return;
    const items = ITEMS.filter(i => i.sec === sec.id && match(i));
    if (!items.length) return;
    html += `<div class="section"><h2>${esc(sec.name)}</h2>` + items.map(i => {
      const s = stat(i);
      return `<div class="item"><div class="l">
        <div class="n">${esc(i.name)}</div>
        ${i.note ? `<div class="i">${esc(i.note)}</div>` : ''}
        ${i.ing ? `<div class="i">${esc(i.ing)}</div>` : ''}
        ${s.ok + s.ko ? `<div class="st"><span class="ok">✓ ${s.ok}</span> · <span class="ko">✗ ${s.ko}</span></div>` : ''}
      </div><div class="p">${fmtPrice(i.price)}</div></div>`;
    }).join('') + `</div>`;
  });
  if (ui.filter === 'all') {
    const qs = SIDEQUESTS.filter(([n, d]) => !q || norm(n + ' ' + d).includes(q));
    if (qs.length) html += `<div class="section"><h2>⚔️ Sidequesty</h2>` +
      qs.map(([n, d]) => `<div class="quest"><div class="n"><b>${esc(n)}</b></div><div class="i" style="color:var(--muted)">${esc(d)}</div></div>`).join('') + `</div>`;
  }
  $('#main').innerHTML = html || `<div class="empty">Nic nenalezeno.</div>`;
}

function empty(msg) {
  $('#main').innerHTML = `<div class="empty">${esc(msg || 'Žádné položky.')}</div>`;
}

// ===================== INIT =====================
const sel = $('#filter');
sel.innerHTML = `<option value="all">Celé menu</option><option value="mixed">Jen míchané drinky (vše se surovinami)</option>` +
  MENU.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
if (![...sel.options].some(o => o.value === ui.filter)) ui.filter = 'all';
sel.value = ui.filter;
sel.onchange = () => { ui.filter = sel.value; session = { ok: 0, ko: 0 }; render(); };

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { ui.mode = t.dataset.mode; session = { ok: 0, ko: 0 }; render(); });
$('#search').oninput = () => renderBrowse();
$('#reset').onclick = () => {
  if (!confirm('Opravdu smazat celý postup?')) return;
  progress = {}; session = { ok: 0, ko: 0 };
  save(LS_PROGRESS, progress);
  render();
};

render();
</script>
</body>
